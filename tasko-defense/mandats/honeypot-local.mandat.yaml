# Mandat de l'opérateur pour SON PROPRE honeypot / banc de pré-prod local.
# « Tout sous mandat » : même la boucle locale exige ce mandat pour le mode purple.
# Tu es ici à la fois Prestataire ET Client (tu possèdes cette infra) : tu peux
# donc signer ce mandat toi-même. Passe `signe: true` une fois que tu assumes
# ce cadre pour ta propre machine.
mandat:
  reference: "TASKO-honeypot-local"

  signe: false          # passe à true pour autoriser le mode purple en local
  signe_par: "[Ton nom — propriétaire de l'infra]"
  signe_le: "[AAAA-MM-JJ]"

  valide_du: "2020-01-01"
  valide_au: "2099-12-31"
  fuseau: "UTC"
  fenetres: []          # pas de restriction horaire sur ta propre infra

  ip_source: []         # pas de contrôle d'IP source en local

  perimetre:
    domaines: []
    ips: ["127.0.0.0/8"]   # honeypot/pré-prod en boucle locale
    heberge_dedie: true

  exclusions:
    domaines: []
    ips: []

  annexe_d_signee: false

  tests_autorises:
    decouverte: false
    scan_web: false
    scan_reseau: false
    test_authentifie: false
    validation_detection: true   # mode purple autorisé sur TON honeypot
    exploitation: false
    ingenierie_sociale: false
